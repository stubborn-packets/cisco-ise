# policy/authz-profiles.yaml
# Plane: desired state. Terraform may create these from Phase 4.
# PR- = authorization profiles. ACL- = downloadable ACLs.
# VLAN names come from inventory/vlans.yaml — VLANs are not ISE objects.
# First write: one lab DACL and one lab profile. No SGT on the profile
# (SGT family is next). Do not manage PermitAccess / DenyAccess.

authorization_profiles:
  - name: PR-wired-lab-access
    state: enabled
    description: Lab wired access. VLAN from inventory/vlans.yaml.
    owner: lab
    bu: lab
    access_type: ACCESS_ACCEPT
    vlan: VLAN-lab-data
    dacl: ACL-permit-all
  
  - name: PR-global-vpn
    state: enabled
    description: Lab VPN access. ASA group policy via Class ou=gp-global-vpn.
    owner: lab
    bu: lab
    access_type: ACCESS_ACCEPT
    dacl: ACL-permit-all
    reauth_timer: 28800
    reauth_connectivity: DEFAULT
    asa_vpn: ou=GP-global-vpn

  - name: PR-infra-permit
    state: enabled
    description: Infra health check. Access accept only. No VLAN, DACL, or SGT.
    owner: lab
    bu: lab
    access_type: ACCESS_ACCEPT

  - name: PR-hr-wired-mab
    state: enabled
    description: HR wired MAB access. VLAN from inventory/vlans.yaml.
    owner: lab
    bu: hr
    access_type: ACCESS_ACCEPT
    vlan: VLAN-hr-data

  - name: PR-guest-wired-mab
    state: enabled
    description: Guest wired MAB access. VLAN from inventory/vlans.yaml.
    owner: lab
    bu: guest
    access_type: ACCESS_ACCEPT
    vlan: VLAN-guest-data

downloadable_acls:
  - name: ACL-permit-all
    state: enabled
    description: Temporary wide-open DACL for lab bring-up only.
    dacl: "permit ip any any"
    dacl_type: IPV4