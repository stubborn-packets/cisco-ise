# policy/exceptions.yaml
# Plane: desired state. Terraform may create these from Phase 6.
# Names use EX-. Required metadata: ticket, owner, expiry.
# Dates must be in the future and follow the format YYYY-MM-DD.
# Phase 2 linter rejects missing fields and dates in the past.
# Rank is not stored here yet. The lab call will send a packed index
# once the module and the reader exist. Sets stay disabled.
# Rank is the packed index inside the parent set. 0 is the first exception.

exceptions:
  - name: EX-vendor-wired-temp
    state: enabled
    policy_set: PS-global-wired-mab
    rank: 0
    ticket: CHG0001234
    owner: lan team
    bu: lab
    expires_on: "2026-12-31"
    description: Temporary vendor printer access while profiling is tuned.
    profiles:
      - PR-wired-lab-access
    condition: CND-wired-mab