# policy/policy-sets.yaml
# Plane: desired state. Terraform may create these from Phase 5.
# Intent: Network Access policy set order and desired names.
# TACACS / Device Admin is out of scope on every environment.
#
# Evaluation order (locked 2026-09-10). Lower rank = evaluated first.
#   1-9    PS-infra-health-checks
#   10     PS-global-vpn
#   20     PS-global-wireless-8021x
#   30     PS-global-wireless-mab
#   40     PS-global-wired-8021x
#   50     PS-global-wired-mab
#   60+    PS-<business-unit>-vpn
#   70+    PS-<business-unit>-wireless
#   80+    PS-<business-unit>-wired
#   99     Default   (ISE built-in — do not rename)
#
# Lab already has non-standard GUI policy sets. Cutover rule:
#   1. Create NEW standard policy sets at the ranks above.
#   2. Leave the old GUI objects in place below them.
#   3. Cut traffic over, then disable, then delete the old objects.
# Do not import non-standard names into Terraform as desired state.
#
# First write: wired subset only. Services are the Phase 4 allowed-protocols
# objects. Conditions are the Phase 4 library conditions. Do not name
# Default Network Access. Do not manage rank 99. Rules stay empty until
# the pinned provider schema is read. No VPN, wireless, infra, or PS-<bu>-*.

policy_sets:
  - name: PS-global-vpn
    rank: 10
    state: disabled
    service: AP-vpn
    condition: CND-vpn
    description: Global VPN. Evaluated before wired.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-vpn
        rank: 0
        state: enabled
        condition: CND-vpn
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: VPN against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-vpn
        rank: 0
        state: enabled
        condition: CND-vpn
        profile: PR-global-vpn
        description: VPN result. Class ou=GP-global-vpn. No VLAN. No SGT.
        owner: lab
    
  - name: PS-global-wired-8021x
    rank: 40
    state: disabled
    service: AP-wired-dot1x
    condition: CND-wired-dot1x
    description: Global wired 802.1X. Evaluated before wired MAB.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wired-dot1x
        rank: 0
        state: enabled
        condition: CND-wired-dot1x-framed
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: Wired 802.1X against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-wired-dot1x
        rank: 0
        state: enabled
        condition: CND-wired-dot1x-framed
        profile: PR-wired-lab-access
        description: Wired 802.1X result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab

  - name: PS-global-wired-mab
    rank: 50
    state: disabled
    service: AP-wired-mab
    condition: CND-wired-mab
    description: Global wired MAB. Evaluated after wired 802.1X.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wired-mab
        rank: 0
        state: enabled
        condition: CND-wired-mab
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: Wired MAB against Internal Endpoints. Unknown MAC continues.
        owner: lab
    authorization_rules:
      - name: AZ-wired-mab
        rank: 0
        state: enabled
        condition: CND-wired-mab-call-check
        profile: PR-wired-lab-access
        description: Wired MAB result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab