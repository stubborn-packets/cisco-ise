# policy/policy-sets.yaml
# Plane: desired state. Terraform may create these from Phase 5.
# Intent: Network Access policy set order and desired names.
# TACACS / Device Admin is out of scope on every environment.
#
# rank is the packed ISE index. Lower is evaluated first. No gaps.
# band is a label. Terraform does not send it. The linter groups by band.
# Live order is the insert order, not the family sequence
# (infra, VPN, wireless, wired, business-unit). HR and guest are 0 and 1
# because they were inserted at 0. Moving a set means editing rank on the
# sets that shift. That edit is the order change.
#
#   rank  name                         band
#   0     PS-hr-wired                  bu-wired
#   1     PS-guest-wired               bu-wired
#   2     PS-infra-health-checks       infra
#   3     PS-global-wireless-8021x     global-wireless
#   4     PS-global-wireless-mab       global-wireless-mab
#   5     PS-global-vpn                global-vpn
#   6     PS-global-wired-8021x        global-wired
#   7     PS-global-wired-mab          global-wired-mab
#
# Rank 99 Default is the ISE built-in. Do not manage it. Do not rename it.
# Do not import non-standard GUI names. Sets stay disabled. Enable is a
# cutover, not this file.
#
# Services are the Phase 4 allowed-protocols objects. Policy-set conditions
# are library conditions. CND-wired-mab stays an authentication-rule
# condition. Do not name Default Network Access. Do not manage the built-in
# Default rule. Identity source is the lab internal store. 802.1X searches
# Internal Users. MAB searches Internal Endpoints. Authorization rules
# return a PR- profile. No SGT on those profiles.

policy_sets:
  - name: PS-hr-wired
    rank: 0
    band: bu-wired
    state: disabled
    service: AP-wired-mab
    condition: CND-hr-wired-mab-call-check
    description: HR wired MAB. Evaluated as a business-unit set.
    owner: lab
    bu: hr
    authentication_rules:
      - name: AN-hr-wired
        rank: 0
        state: enabled
        condition: CND-hr-wired-mab-call-check
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: HR wired MAB. Unknown MAC continues to the EIG check.
        owner: lab
    authorization_rules:
      - name: AZ-hr-wired
        rank: 0
        state: enabled
        condition: CND-hr-eig
        profile: PR-hr-wired-mab
        description: HR wired MAB result. VLAN 30. No SGT.
        owner: lab

  - name: PS-guest-wired
    rank: 1
    band: bu-wired
    state: disabled
    service: AP-wired-mab
    condition: CND-guest-wired-mab-call-check
    description: Guest wired MAB. Evaluated as a business-unit set.
    owner: lab
    bu: guest
    authentication_rules:
      - name: AN-guest-wired
        rank: 0
        state: enabled
        condition: CND-guest-wired-mab-call-check
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: Guest wired MAB. Unknown MAC continues to the EIG check.
        owner: lab
    authorization_rules:
      - name: AZ-guest-wired
        rank: 0
        state: enabled
        condition: CND-guest-eig
        profile: PR-guest-wired-mab
        description: Guest wired MAB result. VLAN 40. No SGT.
        owner: lab

  - name: PS-infra-health-checks
    rank: 2
    band: infra
    state: disabled
    service: AP-infra-health
    condition: CND-infra-f5-health
    description: F5 health check. After HR and guest, before wireless, VPN, and wired.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-infra-f5-health
        rank: 0
        state: enabled
        condition: CND-infra-f5-health
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: F5 probe against Internal Users. User is not created here.
        owner: lab
    authorization_rules:
      - name: AZ-infra-f5-health
        rank: 0
        state: enabled
        condition: CND-infra-f5-health
        profile: PR-infra-permit
        description: F5 probe result. Access accept only. No VLAN.
        owner: lab

  - name: PS-global-wireless-8021x
    rank: 3
    band: global-wireless
    state: disabled
    service: AP-wireless-dot1x
    condition: CND-wireless-dot1x-framed
    description: Global wireless 802.1X. Evaluated before wireless MAB.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wireless-dot1x
        rank: 0
        state: enabled
        condition: CND-wireless-dot1x-framed
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: Wireless 802.1X against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-wireless-dot1x
        rank: 0
        state: enabled
        condition: CND-wireless-dot1x-framed
        profile: PR-wired-lab-access
        description: Wireless 802.1X result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab

  - name: PS-global-wireless-mab
    rank: 4
    band: global-wireless-mab
    state: disabled
    service: AP-wireless-mab
    condition: CND-wireless-mab-call-check
    description: Global wireless MAB. Evaluated after wireless 802.1X.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wireless-mab
        rank: 0
        state: enabled
        condition: CND-wireless-mab-call-check
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: Wireless MAB against Internal Endpoints. Unknown MAC continues.
        owner: lab
    authorization_rules:
      - name: AZ-wireless-mab
        rank: 0
        state: enabled
        condition: CND-wireless-mab-call-check
        profile: PR-wired-lab-access
        description: Wireless MAB result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab

  - name: PS-global-vpn
    rank: 5
    band: global-vpn
    state: disabled
    service: AP-vpn
    condition: CND-global-vpn
    description: Global VPN. Evaluated before wired.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-vpn
        rank: 0
        state: enabled
        condition: CND-vpn
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: VPN against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-vpn
        rank: 0
        state: enabled
        condition: CND-vpn
        profile: PR-global-vpn
        description: VPN result. Class ou=GP-global-vpn. No VLAN. No SGT.
        owner: lab

  - name: PS-global-wired-8021x
    rank: 6
    band: global-wired
    state: disabled
    service: AP-wired-dot1x
    condition: CND-wired-dot1x-framed
    description: Global wired 802.1X. Evaluated before wired MAB.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wired-dot1x
        rank: 0
        state: enabled
        condition: CND-wired-dot1x-framed
        identity_source: Internal Users
