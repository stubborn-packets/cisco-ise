# policy/policy-sets.yaml
# Plane: desired state. Terraform may create these from Phase 5.
# Intent: Network Access policy set order and desired names.
# TACACS / Device Admin is out of scope on every environment.
#
# Evaluation order (locked 2026-09-10). Lower rank = evaluated first.
#   1-9    PS-infra-health-checks
#   10     PS-global-vpn
#   20     PS-global-wireless-8021x
#   30     PS-global-wireless-mab
#   40     PS-global-wired-8021x
#   50     PS-global-wired-mab
#   60+    PS-<business-unit>-vpn
#   70+    PS-<business-unit>-wireless
#   80+    PS-<business-unit>-wired
#   99     Default   (ISE built-in — do not rename)
#
# Lab already has non-standard GUI policy sets. Cutover rule:
#   1. Create NEW standard policy sets at the ranks above.
#   2. Leave the old GUI objects in place below them.
#   3. Cut traffic over, then disable, then delete the old objects.
# Do not import non-standard names into Terraform as desired state.
#
# First write: wired subset only, state disabled. Services are the Phase 4
# allowed-protocols objects. Policy-set conditions are the AND library
# conditions (Ethernet plus Service-Type). CND-wired-mab stays an
# authentication-rule condition. ISE rank is a dense insert index, so the
# lab call cannot POST rank 40 until 40 sets exist. rank here stays the
# design band. Do not name Default Network Access. Do not manage rank 99.
# No VPN service on the wired sets. PS-global-vpn is rank 10, state disabled.
# Service AP-vpn. Condition CND-vpn. AN-vpn searches Internal Users.
# AZ-vpn returns PR-global-vpn. Do not manage the built-in Default rule.
# Wireless sets stay at the old bands, 20 and 30, until the rank conversion.
# The lab call inserts them at 0 and 1 and shifts VPN and wired down.
# rank here is not the ISE index yet.
# Authentication rules are the first rule write. Authorization rules return
# PR-wired-lab-access. No SGT on that profile. Do not manage the built-in
# Default rule. Identity source is the lab internal store. 802.1X searches
# Internal Users. MAB searches Internal Endpoints.

policy_sets:
  - name: PS-hr-wired
    rank: 80
    state: disabled
    service: AP-wired-mab
    condition: CND-hr-wired-mab-call-check
    description: HR wired MAB. Evaluated as a business-unit set.
    owner: lab
    bu: hr
    authentication_rules:
      - name: AN-hr-wired
        rank: 0
        state: enabled
        condition: CND-hr-wired-mab-call-check
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: HR wired MAB. Unknown MAC continues to the EIG check.
        owner: lab
    authorization_rules:
      - name: AZ-hr-wired
        rank: 0
        state: enabled
        condition: CND-hr-eig
        profile: PR-hr-wired-mab
        description: HR wired MAB result. VLAN 30. No SGT.
        owner: lab

  - name: PS-guest-wired
    rank: 81
    state: disabled
    service: AP-wired-mab
    condition: CND-guest-wired-mab-call-check
    description: Guest wired MAB. Evaluated as a business-unit set.
    owner: lab
    bu: guest
    authentication_rules:
      - name: AN-guest-wired
        rank: 0
        state: enabled
        condition: CND-guest-wired-mab-call-check
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: Guest wired MAB. Unknown MAC continues to the EIG check.
        owner: lab
    authorization_rules:
      - name: AZ-guest-wired
        rank: 0
        state: enabled
        condition: CND-guest-eig
        profile: PR-guest-wired-mab
        description: Guest wired MAB result. VLAN 40. No SGT.
        owner: lab

  - name: PS-infra-health-checks
    rank: 1
    state: disabled
    service: AP-infra-health
    condition: CND-infra-f5-health
    description: F5 health check. Evaluated before wireless, VPN, and wired.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-infra-f5-health
        rank: 0
        state: enabled
        condition: CND-infra-f5-health
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: F5 probe against Internal Users. User is not created here.
        owner: lab
    authorization_rules:
      - name: AZ-infra-f5-health
        rank: 0
        state: enabled
        condition: CND-infra-f5-health
        profile: PR-infra-permit
        description: F5 probe result. Access accept only. No VLAN.
        owner: lab

  - name: PS-global-wireless-8021x
    rank: 20
    state: disabled
    service: AP-wireless-dot1x
    condition: CND-wireless-dot1x-framed
    description: Global wireless 802.1X. Evaluated before wireless MAB.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wireless-dot1x
        rank: 0
        state: enabled
        condition: CND-wireless-dot1x-framed
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: Wireless 802.1X against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-wireless-dot1x
        rank: 0
        state: enabled
        condition: CND-wireless-dot1x-framed
        profile: PR-wired-lab-access
        description: Wireless 802.1X result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab

  - name: PS-global-wireless-mab
    rank: 30
    state: disabled
    service: AP-wireless-mab
    condition: CND-wireless-mab-call-check
    description: Global wireless MAB. Evaluated after wireless 802.1X.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wireless-mab
        rank: 0
        state: enabled
        condition: CND-wireless-mab-call-check
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: Wireless MAB against Internal Endpoints. Unknown MAC continues.
        owner: lab
    authorization_rules:
      - name: AZ-wireless-mab
        rank: 0
        state: enabled
        condition: CND-wireless-mab-call-check
        profile: PR-wired-lab-access
        description: Wireless MAB result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab

  - name: PS-global-vpn
    rank: 10
    state: disabled
    service: AP-vpn
    condition: CND-vpn
    description: Global VPN. Evaluated before wired.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-vpn
        rank: 0
        state: enabled
        condition: CND-vpn
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: VPN against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-vpn
        rank: 0
        state: enabled
        condition: CND-vpn
        profile: PR-global-vpn
        description: VPN result. Class ou=GP-global-vpn. No VLAN. No SGT.
        owner: lab

  - name: PS-global-wired-8021x
    rank: 40
    state: disabled
    service: AP-wired-dot1x
    condition: CND-wired-dot1x-framed
    description: Global wired 802.1X. Evaluated before wired MAB.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wired-dot1x
        rank: 0
        state: enabled
        condition: CND-wired-dot1x-framed
        identity_source: Internal Users
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: REJECT
        description: Wired 802.1X against Internal Users.
        owner: lab
    authorization_rules:
      - name: AZ-wired-dot1x
        rank: 0
        state: enabled
        condition: CND-wired-dot1x-framed
        profile: PR-wired-lab-access
        description: Wired 802.1X result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab

  - name: PS-global-wired-mab
    rank: 50
    state: disabled
    service: AP-wired-mab
    condition: CND-wired-mab-call-check
    description: Global wired MAB. Evaluated after wired 802.1X.
    owner: lab
    bu: lab
    authentication_rules:
      - name: AN-wired-mab
        rank: 0
        state: enabled
        condition: CND-wired-mab
        identity_source: Internal Endpoints
        if_auth_fail: REJECT
        if_process_fail: DROP
        if_user_not_found: CONTINUE
        description: Wired MAB against Internal Endpoints. Unknown MAC continues.
        owner: lab
    authorization_rules:
      - name: AZ-wired-mab
        rank: 0
        state: enabled
        condition: CND-wired-mab-call-check
        profile: PR-wired-lab-access
        description: Wired MAB result. VLAN 20 and ACL-permit-all. No SGT.
        owner: lab
